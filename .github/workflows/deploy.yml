name: CI/CD Deploy bailing_doctor

# 专高六·第三阶段 Linux 本地化部署 —— 课程五补充第七章 CI/CD 主线
# push 到 main → 自托管 runner（centos7-local）→ 拉取代码 → 同步依赖 → 重启 systemd → 健康检查
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-bailing-doctor
  cancel-in-progress: false

jobs:
  deploy:
    name: 部署到 CentOS7 虚拟机
    runs-on: [self-hosted, centos7-local]
    steps:
      - name: 0. 触发信息
        run: |
          echo "仓库: ${{ github.repository }}"
          echo "提交: ${{ github.sha }}"
          echo "触发人: ${{ github.actor }}"
          echo "事件: ${{ github.event_name }}"

      - name: 1. 部署前备份
        run: |
          set -e
          mkdir -p /root/backup
          TS=$(date +%Y%m%d_%H%M%S)
          tar -czf /root/backup/app_deploy_$TS.tar.gz \
            --exclude=uploads --exclude=logs --exclude='*.db' --exclude=node_modules \
            -C /root/app . 2>/dev/null || true
          ls -lh /root/backup/app_deploy_$TS.tar.gz
          # 仅保留最近 5 份，避免磁盘占满
          ls -1t /root/backup/app_deploy_*.tar.gz 2>/dev/null | tail -n +6 | xargs -r rm -f
          echo "备份完成"

      - name: 2. 拉取最新代码（SSH deploy key）
        run: |
          set -e
          cd /root/app
          git fetch --all --prune
          git reset --hard origin/main
          # 清理未被 git 跟踪的前端旧产物：历史 tar 部署遗留的旧 hash chunk 不会被 reset 删除
          git clean -fdq static/ || true
          echo "当前提交: $(git log -1 --pretty='%h %s')"
          echo "static 文件数: $(find static/ -type f | wc -l)（跟踪 $(git ls-files static/ | wc -l)）"

      - name: 3. 同步 Python 依赖
        run: |
          set -e
          cd /root/app
          /opt/miniconda3/envs/bailing/bin/pip install -q -r requirements.txt
          echo "依赖已同步"

      - name: 4. 重启 systemd 服务
        run: |
          set -e
          systemctl restart bailing
          sleep 5
          systemctl is-active bailing
          echo "服务已重启"

      - name: 5. 健康检查
        run: |
          set -e
          ok=0
          for i in 1 2 3; do
            root_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8010/ || echo 000)
            api_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8010/api/health || echo 000)
            echo "第 $i 次探测：首页 HTTP $root_code / 接口 HTTP $api_code"
            if [ "$root_code" = "200" ] && [ "$api_code" = "200" ]; then ok=1; break; fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "::error::健康检查失败"
            journalctl -u bailing -n 50 --no-pager
            exit 1
          fi
          echo "健康检查通过，部署成功"
